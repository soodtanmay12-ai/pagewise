.reader-control-main .reader-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;min-height:40px}
.reader-control-main .reader-btn .ic{width:18px;height:18px}

/* ---- 6.2 tune ---- */
.reader .reader-tools{overflow:visible!important;flex-wrap:wrap!important}

@media(max-width:900px){.journal-fullscreen-btn span{display:none}.reader-control-main{width:100%;max-width:none;grid-template-columns:minmax(0,1fr) auto!important;grid-template-rows:auto auto!important;gap:6px 10px!important}.reader-controls{grid-column:1/-1!important;grid-row:1!important;min-width:0;grid-template-columns:40px minmax(0,1fr) 40px!important;gap:8px!important}.rc-left{grid-column:1!important;grid-row:2!important;min-width:0}.rc-right{grid-column:2!important;grid-row:2!important;justify-self:end;display:flex;gap:6px;min-width:max-content}.rc-right .full-page-toggle,.rc-right .mark-btn{min-height:38px;white-space:nowrap}}

/* ---- 6.5 journal + reader refinement (overrides only) ---- */
.journal-icon:disabled{opacity:.32;pointer-events:none}
.journal-stage-head .text-link:disabled{opacity:.38;pointer-events:none}
.journal-paper #journal-text::placeholder{transition:opacity .18s}
.journal-paper.has-content #journal-text::placeholder{opacity:0}

@media(min-width:681px) and (max-width:900px){

 .journal-workspace:not(.journal-fullscreen) .journal-sidebar{order:2;max-height:none!important;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"head list" "tabs list";column-gap:10px;align-items:center;overflow:visible}
 .journal-workspace:not(.journal-fullscreen) .journal-sidebar-head{grid-area:head;padding:2px 4px!important}

 .journal-workspace:not(.journal-fullscreen) .journal-page-thumb{flex:none;display:flex!important;flex-direction:column!important;align-items:center;justify-content:flex-start;width:106px!important;gap:5px;padding:6px 4px!important;text-align:center}
 .journal-workspace:not(.journal-fullscreen) .journal-page-thumb .thumb-label{text-align:center;font-size:11px!important;white-space:nowrap}
}

@media(min-width:901px) and (max-width:1180px){.reader-control-main{grid-template-columns:minmax(max-content,1fr) minmax(200px,620px) minmax(max-content,1fr)!important}}

function weekChart(){const out=[];for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const key=dayKey(dt);out.push({key,m:dayMinutes(key),label:new Intl.DateTimeFormat(undefined,{weekday:'narrow'}).format(dt),today:i===0})}const max=Math.max(15,...out.map(x=>x.m)),total=out.reduce((n,x)=>n+x.m,0);const cells=[],t0=new Date();t0.setHours(0,0,0,0);const dow=(t0.getDay()+6)%7,start=new Date(t0);start.setDate(start.getDate()-dow-77);for(let i=0;i<84;i++){const dt=new Date(start);dt.setDate(start.getDate()+i);const future=dt>t0,m=future?0:dayMinutes(dayKey(dt));cells.push(`<i class="heat-cell${future?' future':''} l${m>=25?4:m>=15?3:m>=5?2:m>0?1:0}" title="${dayKey(dt)} · ${m} min"></i>`)}return `<div class="week-chart"><div class="week-head"><b>This week</b><span>${total} min · goal 15 a day</span></div><div class="week-bars" role="img" aria-label="Active minutes per day, last 7 days: ${out.map(x=>x.key+' '+x.m).join(', ')}">${out.map(x=>`<div class="week-col${x.today?' is-today':''}${x.m>=15?' met':''}"><span class="wm">${x.m||''}</span><i style="height:${Math.max(4,Math.round(x.m/max*100))}%"></i><small>${x.label}</small></div>`).join('')}</div><div class="heat-wrap"><small>Last 12 weeks</small><div class="heat" aria-hidden="true">${cells.join('')}</div></div></div>`}
function nextUpCard(){const core=activeBook(),due=knowledge.filter(k=>k.nextReviewAt<=Date.now()).length,mins=Math.floor(log.seconds/60),np=(log.activePages||[]).length,goalMet=mins>=15||np>=10;let h,p,btn='';if(due){h=`${due} idea${due===1?'':'s'} ready to resurface`;p='Two minutes of retrieval now keeps what you read from fading.';btn='<button class="button" data-action="review-due">Resurface ideas</button>'}else if(core&&!goalMet){const est=finishEstimate(core),left=Math.max(1,15-mins);h=(mins||np)?`Keep going in ${esc(title(core))}`:`Start today with ${esc(title(core))}`;p=`Page ${core.page||1} of ${core.pages}. ${mins?`${left} more active minute${left===1?'':'s'} completes today’s rhythm.`:'Fifteen minutes completes today’s rhythm.'}${est?' '+est.long+'.':''}`;btn=`<button class="button" data-action="open-book" data-id="${esc(core.id)}">${(mins||np)?'Continue reading':'Start reading'}</button>`}else if(core&&!(log.recall?.text||'').trim()){h='Today’s reading is done. Now recall it.';p='Close the book and write what stayed. Retrieval beats rereading.';btn='<button class="button" data-action="scroll-recall">Write recall</button>'}else if(!core){h=books.length?'Choose a core book':'Add your first book';p=books.length?'One book in focus makes it easier to return tomorrow.':'Add two or three PDFs and read 15 pages of each.';btn=books.length?'<button class="button" data-view="library">Open library</button>':'<button class="button" data-action="add-books">Add books</button>'}else{h='You are done for today';p='A small promise kept. Stopping while curious makes tomorrow easier.'}return `<div class="nextup"><div><div class="eyebrow">NEXT UP</div><h2>${h}</h2><p>${p}</p></div>${btn}</div>`}
function sessionStatsHtml(){const m=Math.round((session.seconds||0)/60),from=session.startPage||page,n=Math.abs(page-from),sec=sectionAt(page);return `<div class="session-stats"><span><b>${m}</b> min active</span><span><b>${n}</b> page${n===1?'':'s'}${from!==page?` · p. ${from} → ${page}`:''}</span>${sec?`<span class="sec">${esc(sec.title)}</span>`:''}</div>`}
async function buildOutlineMap(){outlineMap=[];const dc=doc;if(!dc)return;try{const outline=await dc.getOutline();if(!outline?.length)return;const rows=[];const walk=async(items,depth)=>{for(const item of items){let dest=item.dest;if(typeof dest==='string')dest=await dc.getDestination(dest);let n=0;try{if(Array.isArray(dest)&&dest[0])n=await dc.getPageIndex(dest[0])+1}catch{}if(n)rows.push({title:(item.title||'').trim(),page:n,depth});if(item.items?.length)await walk(item.items,depth+1)}};await walk(outline,0);if(dc!==doc)return;outlineMap=rows.sort((a,b)=>a.page-b.page||a.depth-b.depth);updateCaption()}catch(e){console.warn('Outline unavailable',e)}}

function toggleAppTheme(){prefs.darkMode=!prefs.darkMode;savePrefs();applyAppTheme();if(doc){loadInk().then(applyFilter)}if(view==='notes'||view==='notebook')renderView()}
function stepZoom(dir){const levels=['width','page','125','150','200'],i=Math.max(0,levels.indexOf(prefs.zoom)),n=Math.max(0,Math.min(levels.length-1,i+dir));if(n===i)return;prefs.zoom=levels[n];savePrefs();applyFilter();if(doc)renderPage(page)}

/* ----- shortcuts + quick find ----- */
function openShortcuts(){const rows=[['⌘K or /','Quick find: books, journals, commands'],['← → · Space','Turn pages'],['G','Go to a page'],['/ or S','Search inside the book'],['B','Bookmark this page'],['A','Reading comfort'],['F','Full-page mode'],['M','Mark up the page with Pencil'],['E','Switch to eraser and back while marking up or in a journal'],['J','Open this book’s journal'],['+ −','Zoom the page'],['Esc','Close, or leave full page'],['?','This list']];showDialog(`${head('Keyboard shortcuts','Handy with a keyboard attached to your iPad.')}<div class="shortcut-list">${rows.map(([k,v])=>`<div><kbd>${esc(k)}</kbd><span>${esc(v)}</span></div>`).join('')}</div><div class="dialog-actions"><button class="button" data-action="close-dialog">Done</button></div>`)}
let palItems=[],palIndex=0;
function navTo(v){if(doc)closeReader().then(()=>goView(v));else goView(v)}
function paletteCommands(){const c=[],add=(group,label,hint,run,kw='')=>c.push({group,label,hint,run,kw});if(doc){add('Reading','Search in this book','/',()=>openPdfSearch(),'find text');add('Reading','Contents','Chapters',()=>showContents(),'chapters toc outline');add('Reading','Go to page…','G',()=>openGoto(),'jump');add('Reading','Bookmark this page','B',()=>toggleBookmark());add('Reading','Reading comfort','A',()=>toggleAppearance(true),'tone brightness zoom fit theme');add('Reading','Full-page mode','F',()=>toggleFullPageMode(),'immersive');add('Reading','Mark up this page','M',()=>toggleInk(),'pencil draw highlight');add('Reading','Set reading focus','',()=>setReadingFocus(),'question');add('Reading','Finish session','Reflect and save',()=>finishReadingSession(),'recall reflection');add('Reading','Open this book’s journal','J',()=>openNotebook(book.id),'notes');add('Reading','Close book','',()=>closeReader())}
add('Go','Library','',()=>navTo('library'),'shelf books');add('Go','Today','',()=>navTo('today'),'rhythm streak');add('Go','Book journals','',()=>navTo('notes'),'notes');
const due=knowledge.filter(k=>k.nextReviewAt<=Date.now()).length;add('Do','Add books…','',()=>addDialog(),'import pdf');add('Do','Resurface ideas',due?due+' due':'Nothing due',()=>reviewDue(),'review recall');add('Do',prefs.darkMode?'Switch to light mode':'Switch to dark mode','',()=>toggleAppTheme(),'appearance theme');add('Do','Back up library','',()=>exportBackup(),'export');add('Do','Settings & backup','',()=>settingsDialog(),'storage restore');add('Do','Keyboard shortcuts','?',()=>openShortcuts());
for(const b of books){add('Books','Open '+title(b),'p. '+(b.page||1)+' of '+b.pages,()=>openBook(b.id),(b.author||''));add('Books','Journal · '+title(b),'',()=>openNotebook(b.id),'notes')}return c}
function paletteRank(q){const all=paletteCommands(),toks=q.toLowerCase().split(/\s+/).filter(Boolean);let out=all.map(it=>{const hay=(it.label+' '+it.kw+' '+it.group).toLowerCase();if(!toks.every(t=>hay.includes(t)))return null;const lab=it.label.toLowerCase();return{...it,score:(lab.startsWith(toks[0]||'')?2:0)+(it.group==='Books'?1:0)}}).filter(Boolean);if(toks.length)out.sort((a,b)=>b.score-a.score);const n=Number(q);if(doc&&Number.isInteger(n)&&n>=1&&n<=doc.numPages)out.unshift({group:'Reading',label:'Go to page '+n,hint:'',run:()=>changePage(0,n)});if(q.trim().length>=3){const ql=q.trim().toLowerCase();let k=0;for(const b of books){for(const pg of journalListCache.get(b.id)||[]){const body=pg.body||'',at=body.toLowerCase().indexOf(ql);if(at<0)continue;out.push({group:'Journal text',label:'…'+body.slice(Math.max(0,at-30),at+70).replace(/\s+/g,' ').trim()+'…',hint:title(b)+' · page '+pg.page,run:async()=>{await openNotebook(b.id);if(pg.page>1)await changeJournalPage(pg.page)}});if(++k>=6)break}if(k>=6)break}}return out.slice(0,40)}
function renderPalette(){const q=$('#pal-input')?.value||'';palItems=paletteRank(q);palIndex=Math.min(palIndex,Math.max(0,palItems.length-1));const list=$('#pal-list');if(!list)return;let last='';list.innerHTML=palItems.length?palItems.map((it,i)=>{const g=it.group!==last?`<div class="pal-group">${esc(it.group)}</div>`:'';last=it.group;return `${g}<button class="pal-item${i===palIndex?' active':''}" role="option" aria-selected="${i===palIndex}" data-pal="${i}"><span>${esc(it.label)}</span><small>${esc(it.hint||'')}</small></button>`}).join(''):'<div class="pal-empty">Nothing matches. Try a book title or a command.</div>';list.querySelector('.active')?.scrollIntoView({block:'nearest'})}
function openPalette(){if($('#dialog').open&&$('#dialog').classList.contains('palette')){return}loadJournalList();palIndex=0;showDialog(`<div class="palette-box"><input id="pal-input" class="palette-input" type="text" placeholder="Search books, journals, or run a command…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Quick find"><div id="pal-list" class="palette-list" role="listbox"></div><div class="palette-foot"><span>↑↓ choose</span><span>↵ open</span><span>esc close</span></div></div>`);$('#dialog').classList.add('palette');renderPalette();setTimeout(()=>$('#pal-input')?.focus(),30)}
function runPalette(i){const it=palItems[i];if(!it)return;closeDialog();setTimeout(()=>it.run(),0)}
function wirePremium2(){
  $('#palette-btn')?.addEventListener('click',openPalette);$('#mobile-palette')?.addEventListener('click',openPalette);
  document.addEventListener('input',e=>{if(e.target.id==='pal-input'){palIndex=0;renderPalette()}});

    const t=e.target,typing=t&&(['INPUT','TEXTAREA','SELECT'].includes(t.tagName)||t.isContentEditable);
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}

    const k=e.key.toLowerCase();
    if(doc){if(k==='f')toggleFullPageMode();else if(k==='b')toggleBookmark();else if(k==='/'||k==='s'){e.preventDefault();openPdfSearch()}else if(k==='j')openNotebook(book.id);else if(k==='a')toggleAppearance();else if(k==='g'){e.preventDefault();openGoto()}else if(k==='+'||k==='=')stepZoom(1);else if(k==='-')stepZoom(-1);else if(k==='m')toggleInk();else if(k==='?')openShortcuts();else if(k===' '&&(t===document.body||t.id==='page-stage')){e.preventDefault();changePage(e.shiftKey?-1:1)}}

function askChoice(heading,body,choices){return new Promise(resolve=>{const dlg=$('#dialog');let done=false;const finish=v=>{if(done)return;done=true;resolve(v)};showDialog(`${head(esc(heading))}<p class="dialog-copy">${body}</p><div class="dialog-actions">${choices.map((c,i)=>`<button class="button${c.primary?'':' secondary'}" data-choice="${i}">${esc(c.label)}</button>`).join('')}</div>`);dlg.addEventListener('close',()=>finish(null),{once:true});dlg.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{finish(choices[+b.dataset.choice].value);closeDialog()}))})}
const askConfirm=(heading,body,ok='Continue',cancel='Cancel')=>askChoice(heading,body,[{label:cancel,value:false},{label:ok,value:true,primary:true}]).then(v=>!!v);
function cleanTitle(raw,fallback){let t=String(raw||'').trim();const junk=/^(untitled|microsoft word|document\d*|scan|img[_ -]?\d+|new document)/i.test(t)||/\.(docx?|indd|tex|qxd|pdf)$/i.test(t)||t.length<2;if(junk)t=fallback;t=t.replace(/^microsoft word\s*-\s*/i,'').replace(/\.(docx?|indd|pdf)$/i,'');if(!/\s/.test(t))t=t.replace(/[_-]+/g,' ');t=t.replace(/_+/g,' ').replace(/\s{2,}/g,' ').trim();if(t&&t===t.toLowerCase()&&t.length>3)t=t.replace(/(^|\s)([a-z])/g,(m,a,b)=>a+b.toUpperCase());return t||fallback||'Untitled book'}
function openGoto(){if(!doc)return;showDialog(`${head('Go to page',`This book has ${doc.numPages} pages.`)}<form id="goto-form"><label><span class="field-label">Page number</span><input class="field" id="goto-input" type="number" inputmode="numeric" min="1" max="${doc.numPages}" value="${page}" autocomplete="off"></label><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-dialog">Cancel</button><button class="button" type="submit">Go</button></div></form>`);setTimeout(()=>{const i=$('#goto-input');i?.focus();i?.select()},60)}
function wirePremium(){
  addEventListener('popstate',async e=>{if(NAV.silent){NAV.silent=false;return}if(doc){await closeReader({keepHistory:true});navReplace(view);return}if(view==='notebook'){await leaveNotebook(true);return}const t=(e.state&&e.state.pw)||location.hash.slice(1);if(TABS.includes(t)&&t!==view)goView(t,{silent:true})});
  document.addEventListener('click',e=>{const panel=$('#appearance-panel');if(panel&&!panel.hidden&&!e.target.closest('#appearance-panel,[data-action=appearance]'))toggleAppearance(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){const panel=$('#appearance-panel');if(panel&&!panel.hidden&&!$('#dialog').open){e.stopImmediatePropagation();toggleAppearance(false)}}},true);
  document.addEventListener('submit',e=>{if(e.target.id==='goto-form'){e.preventDefault();const n=Math.round(Number($('#goto-input')?.value));if(doc&&n>=1&&n<=doc.numPages){closeDialog();changePage(0,n)}else toast('Enter a page from 1 to '+(doc?.numPages||1)+'.',true)}});
  const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
  addEventListener('dragover',e=>{if(hasFiles(e)){e.preventDefault();document.body.classList.add('dropping')}});
  addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dropping')});
  addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();document.body.classList.remove('dropping');const files=[...e.dataTransfer.files].filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));if(files.length)importFiles(files);else toast('Drop PDF files to add them.',true)});
}

/* ===== Pagewise 6.1 · understanding checks ===== */
const fcPrompts=['Could you explain the last paragraph to a friend, without looking?','Are you understanding this, or just moving your eyes across it?','What is the main claim on this page? Say it in one sentence.','If you closed the book now, what would you remember?','What is one thing here you could not yet explain?','Why is this true, and what causes it?','Can you give a real example of what you just read?','What question is this page answering?'];
const fc={acc:0,next:0,timer:0,i:Math.floor(Math.random()*fcPrompts.length)};
function fcLog(k){log.focus=log.focus||{shown:0,got:0,unsure:0,written:0,skipped:0};log.focus[k]=(log.focus[k]||0)+1;saveDay()}
function fcSchedule(){const avg=Number(prefs.focusMinutes??10);fc.acc=0;fc.next=avg?Math.round(avg*60*(0.6+Math.random()*0.8)):0}
function focusCheckTick(){const avg=Number(prefs.focusMinutes??10);if(!avg){fc.next=0;return}if($('#reader')?.hidden){$('#focus-check')?.remove();return}if(!fc.next)fcSchedule();fc.acc+=10;if(fc.acc<fc.next||$('#focus-check'))return;const r=$('#reader');if(!r||r.classList.contains('reader-writing')||$('#dialog').open||$('#recall-nudge')&&fc.acc<fc.next+30)return;const q=fcPrompts[fc.i++%fcPrompts.length],el=document.createElement('div');el.id='focus-check';el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.innerHTML=`<div class="fc-eyebrow">Understanding check</div><p class="fc-q"></p><div class="fc-actions"><button class="button small" data-action="fc-got">I get it</button><button class="button secondary small" data-action="fc-unsure">Not sure · re-read</button><button class="button quiet small" data-action="fc-write">Write it</button></div>`;el.querySelector('.fc-q').textContent=q;r.appendChild(el);fcLog('shown');clearTimeout(fc.timer);fc.timer=setTimeout(()=>{if($('#focus-check')){$('#focus-check').remove();fcLog('skipped');fcSchedule()}},45000)}
function focusCheckAnswer(kind){clearTimeout(fc.timer);$('#focus-check')?.remove();fcLog(kind);fcSchedule();session.pageSeconds=kind==='unsure'?0:session.pageSeconds;if(kind==='unsure')toast('Good catch. Re-read it slowly, then carry on.');if(kind==='written')comprehensionPrompt()}

init();
</script>
<script type="text/plain" id="pagewise-handover" data-version="6.9.1">
# PAGEWISE HANDOVER (developer notes only; no personal data)

Last updated: 2026-11-05 · Handover version: 6.9.1 · App version: 6.9.1

## 0. RULES FOR ANY CLAUDE READING THIS (read first)
1. This file is the single source of truth for the Pagewise app. Treat it as already told to you; do not make the user repeat anything here.
2. UPDATE RULE: whenever the app, its data model, or its behaviour changes, update this embedded handover, revise the relevant sections, append a dated Changelog line (what and why), and bump the app version. This embedded block is the sole handover/update record. Do not create a separate handover document. Return the updated HTML and PWA package after app changes.
3. Personal notes were removed from the source at the user's request (v6.3). Do not add personal, health, biographical or reading-plan data to this file or anywhere in the code. Personal data belongs only in the user's on-device library and backups.
4. Style: the user reads on a phone. Lead with the answer, be short, ask one question at a time.
5. Sections 1-6 (personal notes) were removed in v6.3; numbering is kept so older references still make sense.

## 7. PAGEWISE APP SPEC (v6.9.1)
- Distribution: one `index.html` app entry with inline CSS and application module, plus PWA sidecars: `manifest.webmanifest`, `sw.js`, icons, and locally bundled PDF.js. GitHub Pages serves it over HTTPS.
- Stack: vanilla JavaScript; Mozilla PDF.js 6.5.438 bundled locally with worker, CMaps, standard fonts, ICC profiles, and WASM. No remote fonts, application scripts, analytics, or upload endpoint. An inline-module SHA-256 Content Security Policy allowlist is refreshed with each release. The app stays a single-file entry because simple GitHub Pages deployment is a user requirement.
- Data schema: IndexedDB `pagewise` v4. Stores books/PDFs, settings, daily logs, notes, and spaced-review knowledge items. Optional PDF.js text selection is off by default and can be enabled from reader appearance settings for digitally generated PDFs. Legacy page-typed notes migrate transactionally into one common book notebook per book; source text is retained and combined. PDF-page annotations remain separate records so they reopen on the correct PDF page. They are excluded from journal views and journal exports; full-library backups preserve them.
- Notebook behavior: one shared, paged journal per book keeps typed writing and journal Pencil strokes together on the same pages. PDF-page annotations remain attached to the PDF page and are excluded from journal exports; full-library backup/restore includes both journal records and PDF-page marks. The Notes screen groups the book’s journal into one card.
- Backups: version 3 JSON payload compressed as gzip where supported, with record/file-size manifest and SHA-256 checksums for each PDF where Web Crypto is available. Restore accepts v2 and v3, validates all records and PDF integrity before writing, then commits related books, notes, logs, review items, and preferences in one IndexedDB transaction. v2 backup page notes consolidate into the common notebook. Backup conversion is sequential and bounded: combined source data is limited to 160 MB, backup files to 220 MB, and expanded restore data to 256 MB. Processing still requires memory; backups are unencrypted and must be kept private.
- Views: Library (15-page auditions, one core book, parked/finished shelf), Today (active minutes, opened pages distinct from engaged pages, 10-page target, recall, reflection, feelings, social practice, due idea review), Book Notes, and reader.
- Reader: Kindle-inspired single-page PDF view with gestures, progress slider, PDF outline, bookmarks, paper/warm/night tones, brightness, warmth, zoom/fit, book-wide typed notes, pressure-aware Pencil drawing, pencil/ballpoint/fountain nibs, adjustable thickness, yellow highlighter, vector eraser, and unlimited stroke-level undo/redo. New strokes are normalized to page coordinates and preserve pressure, tilt, timing, and nib settings. Existing raster-only ink remains as a compatibility base and is never discarded by the stroke upgrade. Journal-page PNG previews are generated during journal export. PDF-page marks remain attached to their PDF pages; full-library backups preserve their editable strokes and any legacy raster base. Marks remain page overlays, not PDF edits. Finger input remains opt-in. Reader experience: paper-tone rendering can be toggled independently from paper/warm/white/night page themes. A restrained reading-session ribbon carries a book-wide focus question and next-time cue, while page progress and active minutes remain quiet. A voluntary finish-session reflection saves recall and one optional real-world experiment into the existing shared notebook; no timer interrupts reading.
- iPad journal and Pencil: the journal can open as a full-screen writing surface with the page list hidden; Escape exits that mode. The drawing canvas reserves pointer input for stylus events and optional finger drawing, suppresses browser panning while drawing, accepts small pressure-bearing touch pointers used by stylus implementations, and uses darker graphite opacity. In iPad portrait reader layouts, page controls reflow onto separate rows.
- Journal drawing engine (v6.5): `journalBase` is an offscreen canvas holding every committed stroke. `syncJournalBase` rebuilds it only when the canvas size, theme, stroke array, or stroke count/last stroke changes, and appends a single new stroke incrementally. `paintJournalCanvas` blits the base and draws only the live stroke; pointer moves call `scheduleJournalPaint` (one paint per animation frame) and use coalesced samples plus a predicted tip point. `setupJournalCanvas(true)` (from `loadJournalPage`) reloads strokes from the saved record; resize and full screen call it without the flag so unsaved in-memory strokes are kept. `queueJournalSave` debounces writes (about 420 ms, forced after 4 s, never mid-stroke); `saveJournalPage` still flushes on page change, leaving, `visibilitychange` and `pagehide`. `syncJournalState` keeps undo/redo availability, the `has-content` class (hides the placeholder) and the Next / New page label current. The pencil nib is a continuous graphite grain tile (`graphitePattern`), shared with reader marks.
- Pencil quick switch (v6.5): iPadOS does not expose the Apple Pencil's own double-tap or squeeze to web pages (only native UIPencilInteraction does), so Pagewise listens for a finger gesture on the journal canvas and the reader ink canvas instead. `quickWire` adds a tap recogniser (`quickTapDown/Move/Up`): a double-tap with one finger (two short taps within 380 ms and 48 px) runs `prefs.quickDouble`; a tap with two fingers runs `prefs.quickTwo`. Actions: `eraser` (eraser and back to the previous tool), `last` (swap with the previous tool), `undo`, `off`. It ignores Pencil/pen pointers, palm-size contacts (over 44 px), drags (over 16 px), long presses (over 320 ms), text mode, and any time finger drawing is on or a stroke is active. `lastTool` remembers the tool before each change (`rememberTool` in the journal-tool and ink-tool actions). The E key runs the eraser toggle. Settings rows are built by `quickSettingsRows`. Defaults: double-tap = eraser, two-finger tap = undo.
- Reader rendering (v6.6): `renderPage` renders into an off-screen canvas (`pageGeometry` holds the size/scale maths) and swaps it into `#pdf-canvas` in one step, so the old page stays visible until the new one is ready (no blank flash). `pageCache` keeps up to 3 rendered pages (2 above 3.3 M px), keyed by book, page and pixel size. After a page settles, `schedulePrefetch` renders the next page in the reading direction when idle (skipped while marking up or when the tab is hidden); `cancelPrefetch` runs first on every `renderPage`; `dropPageCache` runs on open and close. The window resize handler is debounced and only re-renders when `stageSig()` (stage width, plus height in fit-page zoom, plus DPR) changed. `pdfTextCache` stores each page's extracted text for in-book search (per book, cleared on close). `openBook` passes the stored PDF buffer to PDF.js without an extra copy. Home/End jump to the first/last page. A failing `getPage` shows a toast. Pages-read accounting is unchanged: `countPage` records pages seen, `activePages` records pages held for 30 s.
- Book covers (v6.7): the cover is stored on the book record as `coverData`, a `data:image/jpeg;base64,...` text string made by `makePdfCover` (canvas `toDataURL`), and shown directly as the `<img>` source. Earlier versions stored a Blob in IndexedDB and displayed it through an object URL; on iPad Safari that Blob can come back unreadable after a reload (broken image), and `renderView` revokes object URLs. `migrateCovers` (called from `loadData`) converts a saved Blob once: read it as a data URL, check it decodes, store `coverData`, delete `cover`; an unreadable cover is dropped and rebuilt from page 1 the next time the book opens (`openBook` rebuilds whenever `coverData` is missing). The backup file format is unchanged (`cover` base64 plus `coverType`); export reads `coverData`, restore writes it. Never store Blobs on book records. v6.8: `makePdfCover` checks the image decodes (`coverDecodes`: JPEG, then PNG, else no cover) so an undecodable cover is never stored; a capture-phase `error` listener on cover images drops the failing `coverData` and `rebuildCover` rebuilds it once per session from the book's first page (skipped while a book is open; otherwise `openBook` rebuilds it). v6.9.1: `importFiles` stores the new cover as `coverData` (it used `cover`, which was ignored for display and deleted by `migrateCovers` on the next load); the `error` listener no longer saves the deletion (a failed display must not erase the stored cover; the rebuilt cover is saved only when it succeeds); `backfillCovers` runs 1.5 s after start and rebuilds every missing cover one at a time (the same guards as `rebuildCover`, which now writes to the live record in `books`, not a stale snapshot).
- Saving books (v6.9.1): `saveBook` drops any non-string `cover` (a Blob) from the record, serialises writes per book through `queueWrite('book:'+id)`, and if the full write fails retries once without `cover`/`coverData` so reading progress is never lost to a cover problem; the toast now names the error. `DB` is a `let` opened by `openDB()`; `req` and `batch` reopen the connection and retry once on `InvalidStateError`/`UnknownError`/'connection' errors (iOS Safari can drop the IndexedDB connection after the app is suspended).
- Pointer / laser (v6.9): a tool in the journal (`journalTool==='pointer'`) and in reader mark-up (`inkTool==='pointer'`) that shows a pointer without writing anything: nothing is saved, no undo, no ink record. Two styles in `prefs.pointerMode`: `trail` (continuous comet trail that fades over `LASER_LIFE` ms and thins toward its tail, with a head dot) and `dot` (a plain dot that follows the pen or finger). `prefs.pointerColor` (red default; `POINTER_COLORS` swatches use `renderSwatches` kind `pointer`); the existing size slider sets its size. `laserWire` listens on the journal canvas and reader ink canvas (pen and mouse hover show the dot; touch only when Finger is on); drawing goes to its own overlay `canvas.laser-canvas` (created by `laserEnsure` inside the paper / page wrap, `pointer-events:none`) animated by `laserTick`, so ink layers are never touched. `startJournalStroke` and `startInk` return early in pointer mode.
- Learning: comprehension prompts rotate between mechanism, variable change, connection, example, plain-language explanation, and uncertainty. Saved recalls also enter a simple 1/3/7/14-day resurfacing schedule; intervals are illustrative and user can mark recall as retrieved or needing another look. Session focus and reflection are user-led: a question stays with the book, recall is attempted before reopening the text, and an optional small experiment can be recorded. Digital paper tone is a comfort preference, not a claim that a color filter improves comprehension. Reading design favors low distraction, a visible sense of location, and moderate pace; scanned PDF typography cannot be reflowed.
- Reading metrics: opened pages measure exposure. An actively read page requires at least 30 seconds while the recent-interaction timer is running; a reading day qualifies at 10 active minutes or 10 engaged pages. The daily target is 15 active minutes or 10 engaged pages. Idle pause can be configured from 1 to 5 minutes.
- Storage and reliability: app offers a persistent-storage request, quota estimate and low-space prompt, last-backup date and reminder. Service worker deletes only caches with the Pagewise Reading Room prefix and checks its own cache. Core-book selection, removal, and full restore use database transactions. Reader state resets between books; ink encoding is queued under captured book/page IDs; clearing marks deletes the annotation record. Journal export includes the actual journal Pencil images. PDF-page annotation export remains intentionally separate.
- Known limits: fixed-layout PDFs do not reflow; selectable text is optional for digital PDFs, while OCR and text search are not implemented. New Pencil annotations are editable pressure-aware strokes with undo/redo; older raster marks are preserved as a compatible base. Gzip reduces exported size; sequential conversion and explicit source/file/expanded-size limits bound memory use. There is no cross-device sync, application-level encryption, or v1-origin data migration. Actual iPad/Safari/Apple Pencil runtime validation remains open.
- Privacy: GitHub Pages content is public. Personal notes were removed from the source in v6.3 at the user's request; the handover is developer-only. Add no personal data.

- Appearance: optional app-wide dark mode uses a coordinated charcoal, warm-white, copper, and sage palette. It forces a dark reader page so the monochrome Pencil is white and legible; the highlighter stays yellow. Existing raster annotations are recolored only in the display canvas, never rewritten in storage. Shared notebook previews and HTML exports adapt their transparent ink color to the selected appearance.
- Reading design basis: digital distraction is associated with lower comprehension in a meta-analysis; paper-vs-screen differences vary by task and context. Self-explanation and retrieval practice have stronger learning support than passive rereading/highlighting. Medium line lengths supported screen reading in a specific reflowable-text study; this is not applied as a reflow claim for fixed-layout PDFs. A paper-tone filter is offered for preference and comfort, not claimed to increase comprehension. References: https://pmc.ncbi.nlm.nih.gov/articles/PMC12684101/ ; https://doi.org/10.1006/ijhc.2001.0458 ; https://journals.sagepub.com/stoken/rbtfl/Z10jaVH/60XQM/full ; https://doi.org/10.1016/j.edurev.2018.09.003

- v6.2 design: all refinements live in the final blocks of `<style id="pagewise-6">` and are overrides, so markup and behaviour are unchanged. Paperwhite filter is `grayscale(1) brightness(.985) contrast(.94) sepia(.07)`.
- v6.1 understanding checks: `prefs.focusMinutes` (0/5/10/15/25), `focusCheckTick()` called from the 10-second active-reading ticker, card `#focus-check`, actions `fc-got` / `fc-unsure` / `fc-write`, per-day counters in `log.focus`. Backup restore validates the pref.
- v6.0 additions (spec): Navigation uses History API routes plus `#today` / `#notes` hashes (back button closes reader, dialogs and journal in order; manifest shortcuts open Today and Journals). Quick find / command palette (Ctrl/Cmd+K, rail button, mobile search) searches books, journals and commands (go, resurface, dark mode, backup, shortcuts). Appearance and confirmations use in-app dialogs, never native `confirm()`. Reader: go-to-page, finer zoom steps, sharper canvas, section-aware caption, reading-pace ETA, finish-session dialog with session stats and a resume note. Ink: five colours persisted per stroke, included in backup/restore. Today: next-up card, 7-day chart, 12-week heatmap, debounced writes flushed on leave. Backup banner appears only when no backup exists and the oldest book is over 24 hours old, or the last backup is over 7 days old. A design layer (`<style id="pagewise-6">`) holds tokens, dark mode, phone and iPad layouts, reduced-motion handling. Service worker cache `pagewise-reading-room-6.0`: cache-first assets, network-first navigation with a 3.5 s timeout and an offline fallback to the cached shell. Maskable icons are separate from "any" icons.

## 8. DEV RULES FOR FUTURE EDITS
- Keep one HTML app entry with inline CSS and app JavaScript, plus the PWA sidecars required for GitHub Pages and offline support. Do not introduce a build system unless the user changes this requirement.
- The embedded `text/plain` handover is the sole authoritative update record. No separate handover document is wanted. Do not store personal notes in the source.
- On every app or plan update, revise relevant handover sections, append a dated Changelog line, bump the app version, update the service-worker cache version, refresh the inline-script CSP hash if present, and return the refreshed HTML/PWA package.
- Keep typed writing and journal Pencil strokes together in one shared paged journal per book and in its combined HTML journal export. PDF-page Pencil marks remain anchored to their PDF pages, are excluded from journal exports, and are preserved in full-library backups. Never migrate back to typed per-page reader notes.
- Keep imported books, notes, and backups local. No remote application scripts, fonts, analytics, or upload endpoints. Preserve safe areas, reduced-motion support, keyboard focus, and Apple Pencil-first input. Backups include personal data and are not encrypted; describe them as private files.
- GitHub Pages source is public. Keep it free of personal data; this handover holds developer notes only.
- CSS belongs only in the head styles (`<style id="pagewise-6">` for overrides). Never place app CSS inside the journal-export template literal: that is where the v6.4 fixes were lost. After any UI change, verify with a computed-style or geometry check in a browser, and refresh the inline-module CSP hash after any script edit.
